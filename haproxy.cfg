global
    nbthread 1
    maxconn 256

defaults
    mode http
    timeout connect 5s
    timeout client 5m
    timeout server 5m
    timeout http-request 10s
    timeout http-keep-alive 15s
    timeout tunnel 1h

frontend cloudcmd_public
    bind :80
    bind :::80 v6only
    # gpt[0]: failure window end; gpt[1]: block end. IPv4 keys map into IPv6.
    stick-table type ipv6 size 10k expire 2m store gpc0,gpt(2)
    http-request track-sc0 src
    http-request set-var(txn.now) date
    http-request return status 429 content-type text/plain string "Too many authentication failures. Try again later." hdr Retry-After 60 if { sc_get_gpt(1,0),sub(txn.now) gt 0 }

    # Cloud Commander trusts one hop; only the actual TCP peer is authoritative.
    http-request del-header Forwarded
    http-request del-header X-Real-IP
    http-request del-header X-Client-IP
    http-request del-header X-Forwarded-Host
    http-request del-header X-Forwarded-Proto
    http-request set-header X-Forwarded-For %[src]
    # Match pinned http-auth: first full value, Latin-1 Basic whitespace, nonempty second space field.
    acl basic_scheme req.fhdr(Authorization,1) -m reg -i '^Basic[[:space:]\xA0]'
    acl basic_token req.fhdr(Authorization,1),field(2,' ') -m len gt 0
    http-request set-var(txn.basic) bool(true) if basic_scheme basic_token
    default_backend cloudcmd_private

    # Logout has no Basic challenge; a browser's first challenge has no credentials.
    # shortcut: socket auth after upgrade is invisible here, extend native socket auth if it needs throttling.
    acl rejected_basic var(txn.basic) -m bool
    acl challenge status 401
    acl basic_challenge res.hdr(WWW-Authenticate) -m beg -i Basic
    http-response set-var(txn.now) date
    http-response set-var(txn.reset) sc_clr_gpc0(0) if rejected_basic challenge basic_challenge { sc_get_gpt(0,0),sub(txn.now) le 0 }
    http-response sc-set-gpt(0,0) date(60) if rejected_basic challenge basic_challenge { sc_get_gpt(0,0),sub(txn.now) le 0 }
    http-response sc-inc-gpc0(0) if rejected_basic challenge basic_challenge
    http-response sc-set-gpt(1,0) date(60) if rejected_basic challenge basic_challenge { sc_get_gpc0(0) ge 5 } { sc_get_gpt(1,0),sub(txn.now) le 0 }

backend cloudcmd_private
    server cloudcmd 127.0.0.1:8081
